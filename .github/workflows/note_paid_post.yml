name: Paid Note Queue

on:
  push:
    branches:
      - main
    paths:
      - '.github/dispatch/paid-post-now'
  schedule:
    # GitHub drops or delays single cron events, so the 20:00-23:59 JST window is covered by several runs.
    - cron: '0 11 * * *'
    - cron: '23 11 * * *'
    - cron: '47 11 * * *'
    - cron: '13 12 * * *'
    - cron: '41 12 * * *'
    - cron: '19 13 * * *'
    - cron: '53 13 * * *'
  workflow_dispatch:

concurrency:
  group: note-paid-post
  cancel-in-progress: false

jobs:
  post-paid:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: period042/x-affiliate-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - name: Verify data repository identity
        id: data_auth
        env:
          DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
        run: |
          login=$(curl -fsS -H "Authorization: Bearer $DATA_REPO_PAT" https://api.github.com/user | jq -r '.login')
          test "$login" = "period042"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          pip install playwright pillow requests markdown
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Test paid note safeguards
        run: python -m unittest discover -s tests -p 'test_paid_note.py' -v

      - name: Verify Note account
        env:
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from playwright.sync_api import sync_playwright

          state = json.loads(base64.b64decode(os.environ['NOTE_COOKIES']).decode('utf-8'))
          with sync_playwright() as playwright:
              request = playwright.request.new_context(storage_state=state)
              response = request.get('https://note.com/api/v2/current_user', timeout=20000)
              if not response.ok or response.json().get('data', {}).get('urlname') != 'english_gaishi':
                  raise RuntimeError('Note account authentication failed')
              request.dispose()
          PY

      - name: Post up to three paid articles
        env:
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_ACTIONS: "true"
          DATA_DIR: ${{ github.workspace }}/data
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          jst_hour=$(TZ=Asia/Tokyo date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$jst_hour" -lt 20 ]; then
            echo "Delayed schedule event outside the 20:00-23:59 JST window (JST hour $jst_hour); skipped"
            exit 0
          fi
          for attempt in 1 2 3; do
            python scripts/post_paid_note.py
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-note-screenshots-${{ github.run_id }}
          path: /tmp/paid_*.png
          if-no-files-found: ignore

      - name: Commit queue changes
        if: always() && steps.data_auth.outcome == 'success'
        working-directory: data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add note_queue/ note_posted/
          git diff --staged --quiet || git commit -m "chore: auto-post paid Note articles [skip ci]"
          git pull --rebase origin main 2>&1 || git rebase --abort
          git push origin main
