name: Paid Note Queue

on:
  push:
    branches:
      - main
    paths:
      - '.github/dispatch/paid-queue-retry-2026-11-15'
  schedule:
    - cron: '0 11 * * *' # 20:00 JST, normal queue
    - cron: '*/5 11 15 11 *' # November 15, 20:00 JST retry window
  workflow_dispatch:

concurrency:
  group: note-auto-post
  cancel-in-progress: false

jobs:
  post-paid:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: period042/x-affiliate-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - name: Verify data repository identity
        id: data_auth
        env:
          DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
        run: |
          login=$(curl -fsS -H "Authorization: Bearer $DATA_REPO_PAT" https://api.github.com/user | jq -r '.login')
          test "$login" = "period042"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          pip install playwright pillow requests markdown
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Test paid note safeguards
        run: python -m unittest discover -s tests -p 'test_paid_note.py' -v

      - name: Verify Note account
        env:
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from playwright.sync_api import sync_playwright

          state = json.loads(base64.b64decode(os.environ['NOTE_COOKIES']).decode('utf-8'))
          with sync_playwright() as playwright:
              request = playwright.request.new_context(storage_state=state)
              response = request.get('https://note.com/api/v2/current_user', timeout=20000)
              if not response.ok or response.json().get('data', {}).get('urlname') != 'english_gaishi':
                  raise RuntimeError('Note account authentication failed')
              request.dispose()
          PY

      - name: Post up to three paid articles
        env:
          NOTE_COOKIES: ${{ secrets.NOTE_COOKIES }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_ACTIONS: "true"
          DATA_DIR: ${{ github.workspace }}/data
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" = "2026-11-15" ]; then
            if [ "${{ github.event.schedule }}" = "0 11 * * *" ] || [ "${{ github.event.schedule }}" = "*/5 11 15 11 *" ]; then
              echo "One-time 20:00 JST run restricted to paid notes 457, 478, and 479"
              export PAID_QUEUE_ALLOWLIST="457,478,479"
            fi
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" != "2026-11-15" ] && [ "${{ github.event.schedule }}" = "*/5 11 15 11 *" ]; then
              echo "The one-time retry only applies on November 15, 2026"
              exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ -f "${{ github.workspace }}/.github/dispatch/paid-queue-retry-2026-11-15" ]; then
            echo "One-time push-triggered retry for the three remaining requested articles"
            export PAID_QUEUE_ALLOWLIST="457,478,479"
          fi
          for attempt in 1 2 3; do
            python scripts/post_paid_note.py
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-note-screenshots-${{ github.run_id }}
          path: /tmp/paid_*.png
          if-no-files-found: ignore

      - name: Commit queue changes
        if: always() && steps.data_auth.outcome == 'success'
        working-directory: data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add note_queue/ note_posted/
          git diff --staged --quiet || git commit -m "chore: auto-post paid Note articles [skip ci]"
          git pull --rebase origin main 2>&1 || git rebase --abort
          git push origin main
