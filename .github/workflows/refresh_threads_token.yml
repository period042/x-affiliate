name: Refresh Threads Token

on:
  # 毎月1日 9:00 JST (00:00 UTC) に自動リフレッシュ
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Threadsの認証コード（空欄なら現在トークンをth_refresh_tokenで更新）'
        required: false
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Refresh or exchange token
        id: exchange
        env:
          AUTH_CODE:             ${{ inputs.auth_code }}
          APP_SECRET:            ${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN:  ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          APP_ID="1005657055603772"
          REDIRECT_URI="https://localhost/"

          if [ -z "$AUTH_CODE" ]; then
            # ── モード1: th_refresh_token で現在トークンを延長（auth_code不要）──
            echo "[1/1] th_refresh_token で既存トークンを更新中..."
            REFRESH_RESP=$(curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=${THREADS_ACCESS_TOKEN}")
            echo "レスポンス: $REFRESH_RESP"
            NEW_TOKEN=$(echo "$REFRESH_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
            EXPIRES=$(echo "$REFRESH_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in',0))")
            if [ -z "$NEW_TOKEN" ]; then
              echo "リフレッシュ失敗: $REFRESH_RESP"
              exit 1
            fi
            DAYS=$(( EXPIRES / 86400 ))
            echo "✅ リフレッシュ成功（有効期間: ${DAYS}日）"
            echo "TOKEN=$NEW_TOKEN" >> $GITHUB_ENV
            echo "TOKEN_TYPE=refreshed (${DAYS}days)" >> $GITHUB_ENV
          else
            # ── モード2: auth_code から新規トークン取得 ──
            echo "[1/3] 認証コードでトークン取得..."
            SHORT_RESP=$(curl -s -X POST https://graph.threads.net/oauth/access_token \
              --data-urlencode "client_id=$APP_ID" \
              --data-urlencode "client_secret=$APP_SECRET" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "redirect_uri=$REDIRECT_URI" \
              --data-urlencode "code=$AUTH_CODE")

            SHORT_TOKEN=$(echo "$SHORT_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
            INITIAL_EXPIRES=$(echo "$SHORT_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in','none'))")
            if [ -z "$SHORT_TOKEN" ]; then
              echo "トークン取得失敗: $SHORT_RESP"
              exit 1
            fi
            echo "短期トークン取得OK (expires_in=${INITIAL_EXPIRES}秒)"

            echo "[2/3] 長期トークンへ変換 (th_long_lived_token)..."
            LONG_RESP=$(curl -s "https://graph.threads.net/access_token?grant_type=th_long_lived_token&client_secret=$APP_SECRET&access_token=$SHORT_TOKEN")
            LONG_TOKEN=$(echo "$LONG_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")

            if [ -z "$LONG_TOKEN" ]; then
              echo "GET変換失敗: $LONG_RESP"
              echo "[3/3] th_refresh_token で短期トークンを延長..."
              REFRESH_RESP=$(curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=$SHORT_TOKEN")
              LONG_TOKEN=$(echo "$REFRESH_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
              EXPIRES=$(echo "$REFRESH_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in',0))")
              if [ -z "$LONG_TOKEN" ]; then
                echo "リフレッシュも失敗: $REFRESH_RESP — 短期トークンで継続"
                LONG_TOKEN="$SHORT_TOKEN"
                echo "TOKEN_TYPE=short-lived (${INITIAL_EXPIRES}sec)" >> $GITHUB_ENV
              else
                DAYS=$(( EXPIRES / 86400 ))
                echo "✅ th_refresh_token で${DAYS}日延長"
                echo "TOKEN_TYPE=refreshed from short (${DAYS}days)" >> $GITHUB_ENV
              fi
            else
              EXPIRES=$(echo "$LONG_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in',0))")
              DAYS=$(( EXPIRES / 86400 ))
              echo "✅ 長期トークン取得成功（${DAYS}日）"
              echo "TOKEN_TYPE=long-lived (${DAYS}days)" >> $GITHUB_ENV
            fi
            echo "TOKEN=$LONG_TOKEN" >> $GITHUB_ENV
          fi

      - name: Update THREADS_ACCESS_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
          TOKEN: ${{ env.TOKEN }}
        run: |
          echo "$TOKEN" | gh secret set THREADS_ACCESS_TOKEN --repo period042/x-affiliate
          echo "THREADS_ACCESS_TOKEN 更新完了"

      - name: Close token-expired issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(gh issue list --repo period042/x-affiliate --label threads-token-expired --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --repo period042/x-affiliate --comment "✅ トークンを更新しました。自動クローズ。"
            echo "Issue #$ISSUE をクローズしました"
          fi

      - name: Summary
        env:
          TOKEN_TYPE: ${{ env.TOKEN_TYPE }}
        run: |
          echo "## Threadsトークン更新完了" >> $GITHUB_STEP_SUMMARY
          echo "- トークン種別: ${TOKEN_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "- スコープ: threads_basic, threads_manage_replies, threads_manage_insights" >> $GITHUB_STEP_SUMMARY
