name: Test Threads Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test current token validity
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          echo "=== /me エンドポイント ==="
          RESP=$(curl -s "https://graph.threads.net/v1.0/me?fields=id,username&access_token=${TOKEN}")
          echo "$RESP"
          echo "$RESP" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if 'error' in d:
              print('>>> TOKEN INVALID:', d['error'].get('message'), '/ code:', d['error'].get('code'))
          else:
              print('>>> TOKEN VALID - user_id:', d.get('id'), '/ username:', d.get('username','?'))
          "

          echo ""
          echo "=== th_refresh_token 試行 ==="
          REFRESH=$(curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=${TOKEN}")
          echo "$REFRESH"
          echo "$REFRESH" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if 'error' in d:
              print('>>> REFRESH FAILED:', d['error'].get('message'))
          else:
              exp=d.get('expires_in',0)
              print(f'>>> REFRESH OK - expires_in: {exp}sec ({exp//86400}days)')
          "
